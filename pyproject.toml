[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mess"
version = "0.1.0"
description = "A brief description of your project"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Steven Stroka", email = "stroka@uni-wuppertal.de"}]
keywords = ["example", "scientific computing", "data processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

# Specify the required Python version
requires-python = ">=3.11"

# Core dependencies
dependencies = [
    "matplotlib",
    "numpy",
    "scipy"
]

[tool.hatch.build.targets.wheel]
packages = ["src/mess"]

# Configure the source layout by specifying the package directory
[tool.hatch.metadata]
root = "src/mess"
