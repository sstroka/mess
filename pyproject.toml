[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mess"
dynamic = ["version"]
description = "MESS & AdaMESS: Maximum Entropy Snapshot Sampling for memory-efficient reduced-basis generation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Steven Stroka", email = "stroka@uni-wuppertal.de"}]
keywords = ["model order reduction", "reduced basis", "snapshot sampling", "POD", "scientific computing", "electromagnetics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
io = ["h5py"]                                   # SamplingResult.save / load
examples = ["matplotlib", "pillow", "jupyter"]  # examples/ and notebooks/
dev = ["mess[io,examples]", "pytest>=7", "pytest-cov", "ruff"]

[project.urls]
Paper = "https://arxiv.org/abs/2005.01280"
Zenodo = "https://doi.org/10.5281/zenodo.17101989"

[tool.hatch.version]
path = "src/mess/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mess"]

[tool.hatch.build.targets.sdist]
exclude = ["notebooks/data"]

# ---------------------------------------------------------------- tooling
[tool.pytest.ini_options]
testpaths = ["tests", "src/mess"]
addopts = "--doctest-modules"

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
